# Saal-Test gegen den echten Stack (e2e/tests/saal-*.spec.ts, "null 401/404 bei Seitenaufrufen"),
# als zweiter Stack neben dem Dev-Stack: eigene Containernamen und Ports, alle Schalter-Obergrenzen
# an (ausser herkunft_pruefen, das nach aussen ruft). Die Admin-Werte schaltet die Spec selbst
# (E2E_SCHALTER_UMSCHALTEN=1), erst alle aus, dann alle an. Konten wie beim Teams-Stack, mit Admin.
#
#   docker compose -p gg-saal -f docker-compose.dev.yml -f docker-compose.saal-stack.yml up -d --build
#   docker compose -p gg-saal -f docker-compose.dev.yml -f docker-compose.saal-stack.yml down -v
#
# Teststack: kein Neustart nach einem Reboot (restart: "no"). Frontend http://127.0.0.1:48080.
# Ablauf und Variablen: frontend/gutgesagt-frontend/e2e/README.md.
services:
  qdrant:
    container_name: gutgesagt-qdrant-saal
    restart: "no"
    ports: !override
      - "127.0.0.1:46433:6333"
  postgres-app:
    container_name: gutgesagt-app-postgres-saal
    restart: "no"
    ports: !override
      - "127.0.0.1:45533:5432"
  gutgesagt-semantic-search:
    container_name: gutgesagt-semantic-search-saal
    restart: "no"
    ports: !override
      - "127.0.0.1:48000:8000"
    environment:
      - SEMANTIC_SEARCH_SAISON_ZIEL_AKTIV=true
      - SEMANTIC_SEARCH_GARTENANSICHT_AKTIV=true
      - SEMANTIC_SEARCH_KOPIERT_ERFOLG_AKTIV=true
      - SEMANTIC_SEARCH_KONTER_PROBE_AKTIV=true
      - SEMANTIC_SEARCH_LUECKE_ZU_GROSS_AKTIV=true
      - SEMANTIC_SEARCH_EINWILLIGUNG_IM_GEWINN_AKTIV=true
      - SEMANTIC_SEARCH_NAECHSTER_SCHRITT_AKTIV=true
      - SEMANTIC_SEARCH_WIRKUNGS_ECHO_AKTIV=true
      - SEMANTIC_SEARCH_DANKE_KNOPF_AKTIV=true
      - SEMANTIC_SEARCH_DANKE_OHNE_KONTO_AKTIV=true
      - SEMANTIC_SEARCH_RANGLISTE_AKTIV=true
      - SEMANTIC_SEARCH_PUNKTE_AKTIV=true
      - SEMANTIC_SEARCH_ABZEICHEN_SICHTBAR_AKTIV=true
      - SEMANTIC_SEARCH_GEPOSTET_AKTIV=true
      - SEMANTIC_SEARCH_MERKLISTE_AKTIV=true
      - SEMANTIC_SEARCH_ABKUERZUNGEN_AKTIV=true
      - SEMANTIC_SEARCH_ANTWORTEN_HINWEIS_AKTIV=true
      - SEMANTIC_SEARCH_SHAREPIC_AKTIV=true
      - SEMANTIC_SEARCH_TEAMS_AKTIV=true
      - SEMANTIC_SEARCH_TEAMS_OEFFENTLICH_AKTIV=true
      - SEMANTIC_SEARCH_TEAM_FORTSCHRITT_AKTIV=true
      - SEMANTIC_SEARCH_TEAM_QUESTS_AKTIV=true
  gutgesagt-bff:
    container_name: gutgesagt-bff-saal
    restart: "no"
    ports: !override
      - "127.0.0.1:45054:5054"
    environment:
      - FRONTEND_URL=http://127.0.0.1:48080
    volumes: !override
      # Konten des Teams-Stacks: Testkonto und ein Admin mit bekanntem Passwort
      - ./scripts/dev/teams-stack:/config:ro
      - bff_dataprotection_keys:/keys
  gutgesagt-frontend:
    container_name: gutgesagt-frontend-saal
    restart: "no"
    ports: !override
      - "127.0.0.1:48080:80"
