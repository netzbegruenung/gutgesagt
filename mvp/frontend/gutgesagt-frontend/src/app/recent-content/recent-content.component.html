<!-- Recent Content Header -->
<div class="recent-content-header">
  <!-- tabindex -1: Der Sprung von „Seit deinem letzten Besuch“ setzt den Fokus hierher (WCAG 2.4.3) -->
  <!-- Ohne Frisches „Zuletzt ergänzt“ (26.11.); der Anker #recent-content sitzt am Host auf der Startseite -->
  <h2 tabindex="-1">{{ titel }}</h2>

  <!-- Loading Spinner -->
  <app-loading-spinner
    [loading]="loading"
    message="Neueste Beiträge werden geladen …">
  </app-loading-spinner>

  <!-- Error Message -->
  <app-error-message
    [error]="error"
    [showRetry]="true"
    [retryAction]="retryLoad">
  </app-error-message>

  <!-- Nur ganz ohne Beiträge: ein Anfang, kein Misserfolg (26.11.). Kein eigener Link: Der Weg
       ist die Kachel „Beitragen“ direkt darunter, die Besuchern auch „mit Konto“ sagt (#644). -->
  <div *ngIf="!loading && !error && stand === 'anfang'" class="empty-state anfang">
    <p>Hier wächst bald was. Fang an, dein Beitrag kann der erste sein.</p>
  </div>
</div>

<!-- Mobil eine Liste, ab 600 px das Karussell; die Karten schlank, ohne "passt auf Mastodon/Bluesky/X" und Alter (16.11.) -->
<ng-container *ngIf="!loading && !error && karten.length > 0">
  <app-kartenliste *ngIf="istMobil; else karussell" [daten]="angezeigteKarten" [schlank]="true"></app-kartenliste>
  <ng-template #karussell>
    <app-result-carousel [daten]="karten" [schlank]="true"></app-result-carousel>
  </ng-template>
</ng-container>
