<!-- Titel und Untertitel auf Weiss, direkt darunter die Suche im schmalen gelben
     Band: auf dem Handy soll das Suchfeld ohne Scrollen dastehen. -->
<!-- Ohne Markenzeile darueber: Das Logo im Kopf nennt den Namen schon (Startseite 16.11.) -->
<section class="start-hero">
    <div class="hero-title">
        Nie wieder sprachlos
    </div>
    <!-- Mit Bestandszahl statt eigener Karte (Entscheidung 25.11.2026), ohne Zahl die bisherige Zeile -->
    <app-hero-unterzeile class="hero-subtitle"></app-hero-unterzeile>
</section>

<section class="such-band">
    <div class="such-band-inhalt">
        <!-- Ohne Erklaerzeile darueber: Die Beschriftung des Feldes sagt, was hinein gehoert (Startseite 16.11.) -->
        <!-- Statt „Beispiel probieren“: Das Feld tippt Hot Takes vor (Designrunde 17.11.);
             das Startbeispiel zeigt auch der Rundgang -->
        <app-search class="start-suche" feldId="suche" [autofokus]="autofokus" [beispielAnimation]="true"></app-search>
    </div>
</section>

<!-- Reihenfolge und Vorrang der Karten: docs/ARCHITECTURE.md, „Start page: order and priority
     of the cards“. Pro Besuch hoechstens eine Karte mit neuer Richtung (Review 25.11.). -->

<!-- Willkommen beim ersten Besuch unter dem Suchfeld statt darueber: Mobil stand das
     Suchfeld sonst erst weit unten (Nutzerfuehrung 13.11.) -->
<app-rundgang-band ort="start"></app-rundgang-band>

<!-- Saal-Spruch (Schalter saal_spruch): nur an Tagen mit Spruch; geht nur allgemeinen
     Zahlen vor, nicht eigenem Neuem oder Vorschlag; wartet auf Rundgang-Angebote -->
<app-saal-spruch></app-saal-spruch>

<!-- Fuer Angemeldete, nur wenn es Neues gibt (Nutzerfuehrung 13.11.); nicht beim ersten
     Besuch, neben „Dein nächster Schritt“ nur mit Neuem zu eigenen Beitraegen (Review 25.11.) -->
<app-seit-letztem-besuch></app-seit-letztem-besuch>

<!-- Ein Vorschlag aus dem eigenen Stand, nur fuer Angemeldete (#789, Schalter naechster_schritt);
     tritt hinter eigenes Neues im Block darueber zurueck -->
<app-naechster-schritt></app-naechster-schritt>

<!-- Gemeinschaftsziel der Saison (#782): nur mit Schalter saison_ziel und ab der Schwelle -->
<app-saison-ziel></app-saison-ziel>

<!-- Entfaellt ganz, solange zu wenig genutzt wurde (#364). -->
<app-oft-genutzt></app-oft-genutzt>

<!-- Konter-Probe (#786): nur mit Schalter und passender Aussage -->
<app-konter-probe-einstieg></app-konter-probe-einstieg>

<app-recent-content id="recent-content"></app-recent-content>

<!-- Drei Aktionen in einer Kachelart (Startseite 28.11.), unter den Community-Karten: Der Weg
     ohne Konto kommt zuerst (Persona-Runde 18.11.). Einwerfen und Beitragen sind geschuetzt;
     ohne Anmeldung leitet der AuthGuard erst auf "Das erwartet dich mit Konto" (/mit-konto),
     von dort zur Anmeldung und danach zurueck. Anonym sagt "mit Konto" das vorher (#644). Je ein
     kurzer Halbsatz sagt sichtbar, was dahinter passiert (Persona-Runde 18.11.). Themen im
     Ueberblick (#783) fuer alle, ohne Schalter. -->
<section class="start-kacheln" aria-label="Mitmachen">
    <app-start-kachel ziel="/einwerfen" [icon]="kettenIcons.einwerfen" titel="Einwerfen"
        satz="Spruch oder Fundstück schicken" [mitKonto]="(anonym$ | async) === true"></app-start-kachel>
    <app-start-kachel ziel="/contribute" [icon]="kettenIcons.verfassen" titel="Beitragen"
        satz="Eigene Antwort schreiben" [mitKonto]="(anonym$ | async) === true"></app-start-kachel>
    <app-start-kachel [ziel]="gartenZiel" [icon]="themenIcon" [titel]="gartenTitel"
        satz="Wo es schon viele Antworten gibt und wo noch welche fehlen"></app-start-kachel>
</section>

<!-- „Was hat dich gestört?“ fuer die Startphase (Schalter feedback_gestoert): eine Textzeile
     unter den Kacheln, keine eigene Karte (Startseite 28.11.) -->
<app-gestoert-einstieg></app-gestoert-einstieg>

<app-about-teaser></app-about-teaser>
