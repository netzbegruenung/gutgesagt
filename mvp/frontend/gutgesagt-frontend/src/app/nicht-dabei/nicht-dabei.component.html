<section class="nicht-dabei hinweis-box" [attr.aria-labelledby]="titelZeigen ? titelId : null">
    <h2 *ngIf="titelZeigen" [id]="titelId" class="nicht-dabei-titel">{{ titel }}</h2>

    <ng-container *ngIf="aehnliche.length">
        <p class="aehnliche-titel" [id]="listenId">Ähnliche Aussagen</p>
        <ul class="aehnliche" [attr.aria-labelledby]="listenId">
            <li *ngFor="let aussage of aehnliche" class="aehnliche-eintrag">
                <a class="aehnliche-aussage" [routerLink]="['/result']" [queryParams]="sucheNach(aussage)">
                    <span class="aussage-text">{{ aussage.text }}</span>
                    <span class="passt-vielleicht">passt vielleicht</span>
                </a>
                <!-- Ohne Treffer: die vorhandenen Antworten als eigener Link, daneben das Schreiben
                     (UX-Review 26.11.); erst fuer die aehnliche Aussage, dann fuer die eigene Formulierung (#617) -->
                <div *ngIf="ohneTreffer" class="aehnliche-wege">
                    <!-- Echte Zahl der verknuepften Antworten; ohne Antworten kein Link (#617) -->
                    <a *ngIf="aussage.replysuggestions_count > 0" class="antworten-zahl" [routerLink]="['/result']" [queryParams]="sucheNach(aussage)"
                       [attr.aria-label]="antwortenAnsehen(aussage.replysuggestions_count) + ': ' + aussage.text">{{ antwortenAnsehen(aussage.replysuggestions_count) }} <span aria-hidden="true">→</span></a>
                    <a class="selbst-beantworten" [routerLink]="kommentarPfad" [queryParams]="antwortAuf(aussage)"
                       [attr.aria-label]="daraufAntworten + ': ' + aussage.text">{{ daraufAntworten }}</a>
                </div>
            </li>
        </ul>
    </ng-container>

    <!-- Antworten: die Ergebnisseite reicht Satz und Knopf herein -->
    <ng-content></ng-content>
</section>
