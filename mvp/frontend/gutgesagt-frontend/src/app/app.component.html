<div id="app-container">
    <!-- Erstes Element fuer die Tastatur: direkt ins Suchfeld des Starts (#644) -->
    @if (aufStart) {
        <a class="skip-to-main" href="#suche" (click)="zurSuche($event)" data-testid="skip-link">Zur Suche</a>
    }
    <!--
        Kopf am Handy: Pfeil bzw. Logo, Titel, Profilbild (Konto) und (+). Er steht vor main,
        nicht darin: main schneidet mit overflow: hidden ab, und daran klebte position: sticky
        nicht. Der Kopf scrollte weg, und die Seite lief unter die Statusleiste (viewport-fit=cover).
    -->
    <app-mobile-header
        *ngIf="isMobile || isTablet"
        [userInfo]="userInfo"
        [selectedProfilePictureUrl]="selectedProfilePictureUrl"
        (login)="login()"
        [beitragenNeu]="rundgang.beitragenNeu()"
        (contribute)="navigateToContributeView()">
    </app-mobile-header>

    <main id="hauptinhalt" class="main mat-elevation-z8" [class.mit-unterleiste]="isMobile || isTablet">
        <!-- Kopf am Desktop: eine Zeile mit Marke, Zielen und Konto; der Seitentitel steht darunter -->
        <div class="component-box kopf-box" *ngIf="!isMobile && !isTablet">
            <div class="header">
                <div class="left-header-box">
                    <!--
                        Das Logo ist der Weg zur Startseite (#620); zugaenglicher Name
                        "Startseite". Ueber den NavigationService statt per routerLink: Die
                        Destillier-Ansicht soll erst ihren Satz speichern duerfen.
                    -->
                    <a class="logo-link" href="/" aria-label="Startseite" data-testid="logo-startseite"
                       (click)="$event.preventDefault(); zurStartseite()">
                        <img class="kopf-logo" src="marke/logo-v2.svg" alt="" width="44" height="44">
                        <span class="marke-text" aria-hidden="true">Gut gesagt</span>
                    </a>
                </div>

                <!--
                    Navigation Variante 3 (22.11.2026): dieselben Ziele wie in der unteren
                    Leiste am Handy, sichtbar mit Icon und Text: Suchen, Einwerfen, Fangkorb,
                    Meine Beitraege, [+ Beitragen], Mehr. Das Profilbild mit Namen oeffnet
                    nur noch das Konto.
                -->
                <div class="right-header-box">
                    <app-hauptnavigation modus="kopf">
                        @if (userInfo?.isAuthenticated) {
                            <button mat-raised-button class="dark-green-button beitragen-knopf" (click)="navigateToContributeView()"
                                    [matTooltip]="neuHinweis" [matTooltipDisabled]="!rundgang.beitragenNeu()">
                                <mat-icon>add</mat-icon> <span class="beitragen-text">Beitragen</span>
                                <!-- Neu-Punkt, bis Mitmachen beantwortet ist (#587); was er heisst,
                                     sagt der Tooltip, fuer Screenreader als Beschreibung (#644) -->
                                @if (rundgang.beitragenNeu()) {
                                    <span class="neu-punkt" aria-hidden="true"></span>
                                }
                            </button>
                        } @else if (!aufAnmeldeseite) {
                            <!-- Anonym nur "Anmelden": kein "Nicht angemeldet", kein Avatar-Platzhalter (#599) -->
                            <button mat-raised-button class="dark-green-button anmelden-knopf" (click)="login()">
                                Anmelden
                            </button>
                        }
                    </app-hauptnavigation>

                    @if (userInfo?.isAuthenticated) {
                        <app-konto-menue #konto></app-konto-menue>
                        <button type="button" class="konto-knopf" [matMenuTriggerFor]="konto.menue"
                                aria-haspopup="menu" data-testid="konto-knopf">
                            <img [src]="selectedProfilePictureUrl" alt="" class="profile-avatar konto-avatar" />
                            <span class="visually-hidden">Profilmenü: </span>
                            <span class="konto-name">{{ userInfo?.userName }}</span>
                            <mat-icon class="konto-pfeil" aria-hidden="true">expand_more</mat-icon>
                        </button>
                    }
                </div>
            </div>
        </div>

        <!--
            Seitentitel am Desktop unter dem Kopf (23.11.2026): Neben den sichtbaren Zielen war
            fuer ihn kein Platz, und die Ziele rutschten je nach Titel in eine zweite Zeile.
            Auf dem Start und Seiten ohne eigenen Titel nennt ihn nur der Screenreader.
        -->
        @if (!isMobile && !isTablet) {
            <div class="seitenkopf" [class.seitenkopf--leer]="!showBackButton && titelNurVorgelesen">
                @if (showBackButton) {
                    <button mat-icon-button (click)="zurueck()" class="mat-elevation-z1 back-button-header"
                            aria-label="Zurück">
                        <mat-icon>arrow_back</mat-icon>
                    </button>
                }
                <h1 class="desktop-header-title" [class.desktop-header-title--lang]="titelLang"
                    [class.visually-hidden]="titelNurVorgelesen">{{ pageTitle }}</h1>
            </div>
        }

        <div class="main-content">
            <!-- Angebot eines Rundgangs als Band statt Fenster (#587) -->
            <app-rundgang-band></app-rundgang-band>
            <router-outlet></router-outlet>
        </div>

        <app-footer></app-footer>
    </main>

    <!-- Untere Leiste am Handy (Variante 3), ausserhalb von main: fest am unteren Rand -->
    @if (isMobile || isTablet) {
        <app-hauptnavigation modus="leiste"></app-hauptnavigation>
    }
</div>

<!-- Rundgaenge (#389); die Schritte stehen in rundgang-daten.ts. Erst geladen, wenn einer
     laeuft: Die meisten Besuche brauchen ihn nie, das Start-Bundle bleibt schlank. -->
@defer (when rundgang.aktiv()) {
    <app-rundgang></app-rundgang>
}
