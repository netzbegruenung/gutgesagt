<!--
    Oben die Kette in drei Schritten (Einwerfen, Destillieren, Ausformulieren), mit Pfeilen
    zwischen den Kacheln; darunter die vier Beitragstypen zum direkten Verfassen, dann der
    Erstnutzer-Satz und als eigener Abschnitt „Deins“ die Kachel zu den eigenen Beitraegen
    (Rundgang 28.11.). Am Desktop die Kette in einer Reihe und die Typen zweispaltig, mobil
    alles untereinander.
-->
<div class="typ-zeilen">
    <section class="typ-abschnitt ketten-abschnitt">
        <h2 class="typ-zwischenueberschrift" id="abschnitt-kette">Einwerfen und weiterarbeiten</h2>
        <nav aria-labelledby="abschnitt-kette">
            <!-- role="list": Safari nimmt einer Liste ohne Aufzaehlungszeichen sonst die Listen-Semantik -->
            <ol class="ketten-liste" role="list">
                <li class="ketten-schritt">
                    <button type="button" class="typ-zeile einwerfen-block" (click)="navigateToEinwerfen()">
                        <span class="typ-icon" aria-hidden="true">{{ kettenIcons.einwerfen }}</span>
                        <span class="typ-text">
                            <span class="typ-titel">{{ einwerfenTitel }}</span>
                            <span class="typ-satz">{{ fangkorbKurz }}</span>
                        </span>
                    </button>
                </li>
                <li class="ketten-schritt">
                    <mat-icon class="ketten-pfeil" aria-hidden="true">arrow_forward</mat-icon>
                    <button type="button" class="typ-zeile destillieren-block" (click)="fangkorbOeffnen('destillieren')">
                        <span class="typ-icon" aria-hidden="true">{{ kettenIcons.destillieren }}</span>
                        <span class="typ-text">
                            <span class="typ-titel">Einwürfe destillieren</span>
                            <span class="typ-satz">In einem Satz sagen, was der Punkt ist.</span>
                        </span>
                    </button>
                </li>
                <li class="ketten-schritt">
                    <mat-icon class="ketten-pfeil" aria-hidden="true">arrow_forward</mat-icon>
                    <button type="button" class="typ-zeile ausformulieren-block" (click)="fangkorbOeffnen('ausformulieren')">
                        <span class="typ-icon" aria-hidden="true">{{ kettenIcons.verfassen }}</span>
                        <span class="typ-text">
                            <span class="typ-titel">Sätze ausformulieren</span>
                            <span class="typ-satz">Aus dem Satz einen Beitrag machen.</span>
                        </span>
                    </button>
                </li>
            </ol>
        </nav>
    </section>

    <section class="typ-abschnitt verfassen-abschnitt">
        <h2 class="typ-zwischenueberschrift" id="abschnitt-verfassen">Direkt verfassen</h2>
        <nav class="typ-liste" aria-labelledby="abschnitt-verfassen">
            <button type="button" class="typ-zeile commentary-card" (click)="formularOeffnen('commentary')">
                <span class="typ-icon" aria-hidden="true">💬</span>
                <span class="typ-text">
                    <span class="typ-titel">{{ typLabel('commentary') }}</span>
                    <span class="typ-satz">{{ typBeschreibung('commentary') }}</span>
                </span>
            </button>
            <button type="button" class="typ-zeile generictext-card" (click)="formularOeffnen('generictext')">
                <span class="typ-icon" aria-hidden="true">📄</span>
                <span class="typ-text">
                    <span class="typ-titel">{{ typLabel('generictext') }}</span>
                    <span class="typ-satz">{{ typBeschreibung('generictext') }}</span>
                </span>
            </button>
            <button type="button" class="typ-zeile image-card" (click)="formularOeffnen('image')">
                <span class="typ-icon" aria-hidden="true">🖼️</span>
                <span class="typ-text">
                    <span class="typ-titel">{{ typLabel('image') }}</span>
                    <span class="typ-satz">{{ typBeschreibung('image') }}</span>
                </span>
            </button>
            <button type="button" class="typ-zeile post-card" (click)="formularOeffnen('post')">
                <span class="typ-icon" aria-hidden="true">📣</span>
                <span class="typ-text">
                    <span class="typ-titel">{{ typLabel('post') }}</span>
                    <span class="typ-satz">{{ typBeschreibung('post') }}</span>
                </span>
            </button>
        </nav>
    </section>

    <p class="erstnutzer-satz">{{ erstnutzerSatz }}</p>

    <!-- Die eigene Sammlung als eigener Abschnitt „Deins“, im Stil der Kacheln darüber (Rundgang 28.11.;
         vorher ein Knopf unter einer Trennlinie, der kaum auffiel) -->
    <section class="typ-abschnitt deins-abschnitt">
        <h2 class="typ-zwischenueberschrift" id="abschnitt-deins">Deins</h2>
        <nav class="typ-liste" aria-labelledby="abschnitt-deins">
            <button type="button" class="typ-zeile meine-beitraege-kachel beitraege-block"
                    (click)="navigateToMeineBeitraege()">
                <span class="typ-icon" aria-hidden="true">📦</span>
                <span class="typ-text">
                    <span class="typ-titel">Meine Beiträge</span>
                    <span class="typ-satz">{{ meineBeitraegeSatz }}</span>
                </span>
            </button>
        </nav>
    </section>
</div>
