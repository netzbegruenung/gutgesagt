<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Nur den Ursprung als verweisende Seite: Die Adresse der Ergebnisseite traegt
       den Suchtext und stuende sonst in Zugriffsprotokollen (#275). -->
  <meta name="referrer" content="strict-origin">
  <title>Gut gesagt – Nie wieder sprachlos</title>
  <!-- Linkvorschau in Messengern (WhatsApp, Signal, Telegram). Crawler fuehren kein JavaScript
       aus und sehen nur diese Datei. Beschreibung freigegeben am 14.11.2026 (E4). og:title gleicht
       <title>, das prueft scripts/tests/test_vorschau_tags.py. Das Bild mit absoluter Adresse,
       sonst zeigt WhatsApp keins; fest die Produktionsadresse, auch auf test (dasselbe Bild). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gut gesagt">
  <meta property="og:locale" content="de_DE">
  <!-- Vorschau je Beitrag und fuer die Ergebnisseite (#360): Fuer /beitrag/<id> und /result
       wertet nginx die beiden SSI-Anweisungen aus (nginx.conf, nginx.docker.conf) und setzt
       Titel und Beschreibung aus dem Suchdienst ein (api/v1/linkvorschau.py). Kommt von dort
       nichts, stehen die Angaben aus dem Block. Fuer alle anderen Seiten sind beide
       Anweisungen gewoehnliche Kommentare, und der Block gilt unveraendert. -->
  <!--# block name="linkvorschau_allgemein" -->
  <meta property="og:title" content="Gut gesagt – Nie wieder sprachlos">
  <meta property="og:description" content="Gute Antworten gegen Stimmungsmache im Netz. Finden, kopieren, posten.">
  <meta name="twitter:description" content="Gute Antworten gegen Stimmungsmache im Netz. Finden, kopieren, posten.">
  <!--# endblock -->
  <!--# include virtual="$linkvorschau" stub="linkvorschau_allgemein" -->
  <!-- Vorschaubild 1200 x 630 (28.11.2026): Messenger zeigen es gross statt des kleinen Symbols,
       im ueblichen Mass 1,91:1. Alles Lesbare steht in der quadratischen Mitte, weil
       Browser-Startseiten ein Quadrat aus der Mitte schneiden (beim flacheren v1, 1200 x 500, fehlte
       dort der Rand des Satzes). Quelle und Inhalt in marke/linkvorschau-v2.svg. Es gilt auch fuer
       /beitrag und /result (steht ausserhalb des SSI-Blocks) und zeigt deshalb keinen bestimmten
       Beitrag. Breite und Hoehe stehen dabei, damit WhatsApp das Bild beim ersten Abruf gross
       zeigt, ohne es erst zu laden. -->
  <meta property="og:image" content="https://gutgesagt.netzbegruenung.de/marke/linkvorschau-v2.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Daumen-hoch-Logo, darunter: Darauf gibt’s eine gute Antwort. Gut gesagt, Netzbegrünung.">
  <meta name="twitter:card" content="summary_large_image">
  <base href="/">
  <!-- viewport-fit=cover: Die untere Leiste am Handy haelt mit env(safe-area-inset-bottom)
       Abstand zur Home-Leiste; der mobile Kopf mit env(safe-area-inset-top) zur Statusleiste. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Build-Kennung fuer den Footer: replace-env.sh setzt Commit und Version beim Containerstart
       hier ein, nicht in den *.js-Dateien. Deren Name entsteht vor der Ersetzung, nginx laesst
       sie ein Jahr im Cache, und der Footer zeigte so den Commit eines alten Builds;
       index.html liefert nginx ohne Cache. -->
  <meta name="gutgesagt-commit" content="${GIT_SHA}">
  <meta name="gutgesagt-version" content="${APP_VERSION}">
  <!-- Bilder lieferte nginx bis zum 20.11.2026 mit "expires 1y" aus, deshalb tragen die Symbole
       und das Logo vom 29.10. "-v2"; die alten Dateien bleiben fuer alte Verweise liegen. Seitdem
       liegen ungehashte Dateien aus public/ nur einen Tag im Cache, danach fragt der Browser
       nach: Ein geaendertes Bild darf seinen Namen behalten und ist hoechstens einen Tag alt. Dass jede hier und im Manifest genannte Datei existiert, prueft
       scripts/tests/test_symbole.py. Die Symbole "-v3" (20.11.2026) zeigen das Logo auf dem App-Gelb
       des Such-Bandes, gerendert aus marke/favicon-v3.svg; der neue Name laesst Handys mit
       installierter App das Symbol neu laden. Die Favicons "-v4" (25.11.2026) zeigen dasselbe
       Motiv als abgerundetes Quadrat mit durchsichtigen Ecken, gerendert aus marke/favicon-v4.svg;
       der neue Name umgeht den Favicon-Cache der Browser, der eigene Regeln hat. Die ersetzten
       Favicon-PNGs "-v3" sind entfernt, seit der Tagesregel braucht sie kein Verweis mehr. Die App-Symbole
       bleiben eckig "-v3": iOS und Android runden sie selbst. -->
  <link rel="icon" type="image/svg+xml" href="marke/favicon-v4.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="marke/favicon-64-v4.png">
  <link rel="icon" type="image/png" sizes="32x32" href="marke/favicon-32-v4.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Hell oder dunkel (#588): eigene Wahl aus dem Umschalter, sonst die Geraeteeinstellung.
       color-scheme meldet beides, damit Erweiterungen wie Dark Reader das eigene dunkle
       Thema erkennen. Die Farbe der Browserleiste setzen Skript und FarbschemaService. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#008939">
  <!-- Farbschema vor dem ersten Bild setzen: data-theme am <html>, gleiche Logik und gleicher
       Schluessel wie FarbschemaService; ohne Speicher gilt das Geraet. -->
  <script>
    (function () {
      var schema = null;
      try {
        schema = localStorage.getItem('gutgesagt-farbschema');
      } catch (e) {}
      if (schema !== 'light' && schema !== 'dark') {
        schema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', schema);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', schema === 'dark' ? '#121619' : '#008939');
    })();
  </script>
  <!-- Grundflaechen dunkel, bis das Stylesheet da ist: Der Build inlined nur das kritische CSS,
       das zur Build-Zeit zum <html> ohne data-theme passt, und laedt den Rest nachtraeglich.
       Hier stehen nur Grund, Karten, Schrift und die Baender (Suche, Willkommen/Rundgang folgen
       --kopf); alles andere kommt mit dem Stylesheet, dessen Werte danach gelten (es steht
       danach). Werte wie im Block html[data-theme='dark'] in theme/custom-theme.scss; das prueft
       scripts/tests/test_farbschema_inline.py. -->
  <style>
    html[data-theme='dark'] {
      color-scheme: dark;
      --bg-main: #121619;
      --flaeche: #1b2125;
      --text: #ededee;
      --primaer-text: #ebebeb;
      --akzent-schrift: #f2f2f2;
      --kopf: #18212a;
      background: var(--bg-main);
      color: var(--text);
    }

    html[data-theme='dark'] body {
      background: var(--bg-main);
      color: var(--text);
    }
  </style>
  <!-- Auf dem iPhone-Home-Bildschirm: iOS nimmt das Symbol nicht aus dem Manifest, sondern
       hieraus, und fuellt Transparenz schwarz. Deshalb 180 x 180 ohne Alphakanal. Titel unter
       dem Symbol und Start ohne Browserleiste; "default" laesst die Statusleiste der
       Geraeteeinstellung folgen (hell/dunkel), "black-translucent" legte die
       Seite unter die Statusleiste. -->
  <link rel="apple-touch-icon" sizes="180x180" href="marke/apple-touch-icon-180-v3.png">
  <meta name="apple-mobile-web-app-title" content="Gut gesagt">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <app-root></app-root>
</body>
</html>
