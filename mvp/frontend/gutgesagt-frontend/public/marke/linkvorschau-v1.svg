<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<!-- Linkvorschau (og:image) fuer Messenger, 1200 x 630 (1,91:1, das Format, das WhatsApp, Signal und
     Telegram gross zeigen). linkvorschau-v1.png ist aus dieser Zeichnung gerendert (Chromium, Schriften aus
     ../fonts/). Das Bild gilt fuer jede geteilte Seite, auch /beitrag/<id> und /result (dort setzt nginx nur
     Titel und Beschreibung ein, das Bild bleibt): deshalb zeigt es den Ablauf (Parole, darauf eine bewaehrte
     Antwort) ohne einen bestimmten Beitrag, sonst widersprechen sich Bild und Titel. Absender Netzbegruenung,
     keine Personen, keine Anzeigenamen. Logo: logo-v2.svg (Hand "Thumbs up" aus Fluent Emoji, Copyright (c)
     Microsoft Corporation, MIT-Lizenz, siehe FLUENT-EMOJI-LIZENZ.txt). Schriften: GrueneType und PT Sans,
     dieselben Dateien wie in der App (src/styles.css). Farben wie das Teilen-Bild (sharepic.ts): Grund App-Gelb
     #f6ff7c, Tannengruen #005437, Text #1f1f1f, alle Paare ueber 4,5:1. Logo und Claim stehen in der Mitte
     (x 285 bis 915), damit ein quadratischer Ausschnitt sie behaelt; Schrift ab 36 px, damit sie auch bei
     300 px Vorschaubreite lesbar bleibt. -->
<style>
@font-face{font-family:GT;src:url(../fonts/GrueneTypeNeue-Regular.woff2)}
@font-face{font-family:PT;src:url(../fonts/PTS55F.ttf)}
@font-face{font-family:PTB;src:url(../fonts/PTS75F.ttf)}
.marke{font-family:GT;fill:#005437}
.t{font-family:PT;fill:#1f1f1f;font-size:42px}
.tb{font-family:PTB;fill:#1f1f1f;font-size:42px}
.s{font-family:PTB;fill:#fff;font-size:40px}
.f{font-family:PTB;fill:#005437;font-size:34px}
</style>
<rect width="1200" height="630" fill="#f6ff7c"/>
<image href="logo-v2.svg" x="440" y="30" width="92" height="92"/>
<text class="marke" x="545" y="98" font-size="56">Gut gesagt</text>
<text class="marke" x="600" y="214" font-size="82" text-anchor="middle">Nie wieder sprachlos</text>
<g transform="translate(130 250)">
  <rect width="600" height="76" rx="38" fill="#005437"/>
  <path d="M44 68 L30 98 L80 72 Z" fill="#005437"/>
  <text class="s" x="300" y="52" text-anchor="middle">Die Parole im Familienchat?</text>
</g>
<g transform="translate(130 350)">
  <rect width="940" height="160" rx="30" fill="#fff" stroke="#005437" stroke-width="3"/>
  <text class="tb" x="44" y="66">Darauf eine bewährte Antwort:</text>
  <text class="t" x="44" y="122">finden, kopieren, posten.</text>
</g>
<text class="f" x="600" y="584" text-anchor="middle">Netzbegrünung · gutgesagt.netzbegruenung.de</text>
</svg>
